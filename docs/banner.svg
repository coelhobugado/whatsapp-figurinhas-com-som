<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">WhatsApp figurinhas com som</title>
  <desc id="desc">Bot que transforma vídeos em figurinhas animadas com som para o WhatsApp</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#075e54"/>
      <stop offset="1" stop-color="#128c7e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd54f"/>
      <stop offset="1" stop-color="#ff8a65"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- figurinha -->
  <g transform="translate(110 70) rotate(-6 130 130)">
    <rect x="0" y="0" width="260" height="260" rx="44" fill="#ffffff"/>
    <rect x="14" y="14" width="232" height="232" rx="34" fill="url(#card)"/>
    <circle cx="95" cy="110" r="16" fill="#3e2723"/>
    <circle cx="165" cy="110" r="16" fill="#3e2723"/>
    <path d="M80 160 Q130 215 180 160" fill="none" stroke="#3e2723" stroke-width="14" stroke-linecap="round"/>
    <!-- dobrinha da figurinha -->
    <path d="M200 246 L246 200 L246 246 Z" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- ondas de som -->
  <g fill="none" stroke="#dcf8c6" stroke-width="14" stroke-linecap="round">
    <path d="M400 165 Q425 200 400 235"/>
    <path d="M435 135 Q480 200 435 265"/>
    <path d="M470 105 Q535 200 470 295"/>
  </g>
  <text x="570" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Figurinhas com som</text>
  <text x="572" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#dcf8c6">Bot de WhatsApp: vídeo vira figurinha com áudio</text>
  <text x="572" y="295" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#b2dfdb">WhatsApp sound sticker bot · Node.js · Baileys · FFmpeg</text>
</svg>
